<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#333333">
<title>OPM LKO</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="OPM LKO">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bar:#333333; --bar-dk:#252525;
    --brown:#8b5a2b; --brown-dk:#5c3a1a; --tan:#c49a6c; --tan-wash:#f7f1ea;
    --page:#ffffff; --ink:#111111; --pencil:#6d6d6d; --rule:#e5e5e5;
    --paper:#faf9f5; --hi:#1f7a6b; --lv:#b06a1f; --dup:#b8540e; --sc:#2f6ea8;
    --del:#b23a2e; --del-wash:#fdf3f2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* simplified header: hide keyword chips, stats line, and dup/sort buttons */
  .searchbar .chips,#stats,#s-dups{display:none}
  .mlabel{color:var(--pencil);font-size:12px;margin-right:6px;align-self:center}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--page);color:var(--ink);
       font:15px/1.55 "Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif}
  .mono{font-family:ui-monospace,"Courier New",monospace}

  .brandbar{background:var(--bar)}
  .brandbar-in{max-width:1180px;margin:0 auto;display:flex}
  .sitenav{display:flex;flex-wrap:wrap}
  .sitenav a{color:#f0f0eb;text-decoration:none;font-size:14px;letter-spacing:.02em;text-transform:uppercase;
    padding:19px 14px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.08)}
  .sitenav a:first-child{border-left:1px solid rgba(255,255,255,.08)}
  .sitenav a:hover,.sitenav a[aria-current="page"]{background:var(--bar-dk)}
  .sitenav a:focus-visible{outline:2px solid var(--tan);outline-offset:-3px}
  .logoband{max-width:1180px;margin:0 auto;padding:22px 24px 20px}
  .wordmark{display:inline-flex;align-items:center;gap:14px;text-decoration:none;color:#000}
  .wordmark svg{width:auto;height:65px} /* matches wordmark text block height */
  .wm{font-family:Georgia,"Times New Roman",serif;line-height:1}
  .wm b{display:block;font-size:38px;border-bottom:2px solid #000;padding-bottom:2px}
  .wm i{display:block;font-style:normal;font-size:20px;font-weight:700;margin-top:3px}
  .hairline{border-top:1px solid var(--rule)}

  .searchbar{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--rule)}
  .fuzznote{margin:14px 0 0;padding:10px 14px;background:var(--paper);border-left:3px solid var(--brown);
    font-size:13px;color:var(--pencil)}
  .toc{margin:16px 0 4px;background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--brown)}
  .toc summary{cursor:pointer;padding:12px 16px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--brown-dk);font-weight:700;user-select:none}
  .tocgrid{columns:2;gap:0 26px;padding:2px 14px 12px}
  .tocrow{display:flex;align-items:baseline;gap:10px;width:100%;border:0;background:transparent;cursor:pointer;
    padding:5px 4px;text-align:left;break-inside:avoid;border-bottom:1px dotted var(--rule)}
  .tocrow:hover .tocname{color:var(--brown-dk);text-decoration:underline}
  .tocpg{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--brown-dk);min-width:52px;flex:0 0 auto}
  .tocname{font-size:13.5px;color:#2c2c30}
  @media (max-width:700px){ .tocgrid{columns:1} .tocname{font-size:14px} .tocrow{padding:8px 4px} }
  .sb-in{max-width:1180px;margin:0 auto;padding:14px 24px 0}
  h1{font-size:38px;font-weight:800;color:var(--brown);margin:2px 0 0;text-align:center;
     letter-spacing:.02em;font-family:Georgia,"Times New Roman",serif}
  .tagline{margin:2px 0 6px;text-align:center;color:var(--brown-dk);font-size:17px;
     font-style:italic;font-family:Georgia,"Times New Roman",serif}
  .field{display:flex;align-items:center;gap:12px;margin-top:10px}
  .field .caret{color:var(--brown);font-size:22px}
  #q{flex:1;border:0;border-bottom:2px solid var(--bar);background:transparent;padding:8px 2px 10px;
     font:400 22px/1.2 inherit;color:var(--ink);outline:none}
  #q::placeholder{color:#b6b1a6}
  #q:focus{border-bottom-color:var(--brown)}
  #clear{border:0;background:transparent;cursor:pointer;color:var(--pencil);font-size:12px;letter-spacing:.1em;
    min-width:44px;min-height:44px}
  .tabs{display:flex;margin-top:12px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:11px 15px;cursor:pointer;
    font:600 13px/1 inherit;color:var(--pencil);white-space:nowrap;min-height:44px}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brown)}
  .tabs .n{color:var(--pencil);font-weight:400;font-size:11px;margin-left:5px}
  .tabs button[data-tab="marked"][aria-selected="true"]{border-bottom-color:var(--del);color:var(--del)}
  .chips{display:flex;gap:7px;padding:10px 0 2px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--rule);background:transparent;color:var(--pencil);border-radius:999px;
    padding:7px 13px;font:500 12px/1 inherit;cursor:pointer;min-height:34px}
  .chip:hover,.chip:focus-visible{border-color:var(--brown);color:var(--brown-dk);outline:none}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0 10px;
    font-size:12px;color:var(--pencil);flex-wrap:wrap}
  .sorts{display:flex;gap:2px;align-items:center}
  /* left control (match mode) */
  .sorts button{border:1px solid var(--rule);background:transparent;color:var(--pencil);padding:6px 12px;cursor:pointer;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;min-height:32px;border-radius:6px}
  .sorts button[aria-pressed="true"]{background:var(--bar);color:#fff;border-color:var(--bar)}
  .sorts .mlabel{font-size:12px}
  /* right control (sort order): compact */
  .sortside{margin-left:auto}
  .sortside button{font-size:10px;padding:4px 9px;min-height:0}
  .sortside .mlabel{font-size:11px}
  .sortside button:first-of-type{border-top-right-radius:0;border-bottom-right-radius:0}
  .sortside button:last-of-type{border-top-left-radius:0;border-bottom-left-radius:0}
  @media (max-width:700px){
    /* 1. tabs: the dominant control — bigger, evenly spread across the width */
    .tabs{margin-top:10px}
    .tabs button{flex:1;text-align:center;font-size:15px;padding:12px 6px;min-height:48px}
    .tabs .n{font-size:12px}
    /* 2. controls stack under the tabs; each row on its own line, label above buttons */
    .bar{flex-direction:column;align-items:stretch;gap:10px;padding:10px 0 12px}
    .sorts{flex-wrap:wrap;justify-content:center;gap:6px}
    .sorts .mlabel{flex-basis:100%;text-align:center;margin:0 0 2px;font-size:12px}
    /* match buttons: comfortable tap size, second in the hierarchy */
    .sorts button{font-size:12px;padding:9px 14px;min-height:40px;flex:1;max-width:200px}
    /* sort pair: smallest of the three */
    .sortside{margin-left:0}
    .sortside .mlabel{font-size:10.5px}
    .sortside button{font-size:10px;padding:5px 10px;min-height:30px;flex:0 1 auto;max-width:none}
    /* phone header order: title, tagline, controls scroll away; search + tabs pin.
       The sticky offset (negative top) is set by sizePin() in JS — native scrolling,
       no scroll listeners, no animation. */
    .sb-in{display:flex;flex-direction:column}
    .searchbar h1{order:1} .searchbar .tagline{order:2}
    .searchbar .bar{order:3;padding:2px 0 10px}
    .searchbar .field{order:4} .searchbar .tabs{order:5}
    .searchbar .chips{order:6}
  }

  main{max-width:1180px;margin:0 auto;padding:16px 24px 56px}
  .note{background:var(--tan-wash);border-left:3px solid var(--brown);padding:12px 14px;margin:0 0 18px;
    font-size:13.5px;line-height:1.6;color:#3b3a36}
  .note b{color:var(--brown-dk)}
  .note.warn{background:var(--del-wash);border-left-color:var(--del)}
  .note.warn b{color:var(--del)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
  .card{border:1px solid var(--rule);background:var(--page);display:flex;flex-direction:column;text-align:left;
    padding:0;border-top:4px solid var(--rule);transition:box-shadow .16s,transform .16s;position:relative}
  .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.13);transform:translateY(-2px)}
  .card.b-hi{border-top-color:var(--hi)} .card.b-lv{border-top-color:var(--lv)}
  .card.b-dup{border-top-color:var(--dup)} .card.b-sc{border-top-color:var(--sc)}
  .card.marked{border-color:var(--del);background:var(--del-wash)}
  .card.marked .shot img{opacity:.45;filter:grayscale(1)}
  .card.marked .ttl{text-decoration:line-through;color:var(--del)}
  .shot{cursor:pointer;border:0;padding:0;background:transparent;display:block;width:100%}
  .shot img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block;background:#fff;
    border-bottom:1px solid var(--rule)}
  .shot:focus-visible{outline:2px solid var(--brown);outline-offset:-2px}
  .meta{padding:10px 11px 12px}
  .pg{font:10.5px ui-monospace,"Courier New",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--pencil)}
  .pg{display:flex;align-items:center;gap:7px}
  .pg .pnum{background:var(--bar);color:#fff;font-weight:700;padding:2px 7px;border-radius:3px;
    font:700 11px/1.4 ui-monospace,monospace;letter-spacing:.03em}
  .pg .bk{font-weight:700}
  .jbtext em{font-style:normal;font-size:11px;color:var(--pencil)}
  .b-hi .pg .bk{color:var(--hi)} .b-lv .pg .bk{color:var(--lv)}
  .b-dup .pg .bk{color:var(--dup)} .b-sc .pg .bk{color:var(--sc)}
  .ttl{font-weight:700;font-size:13.5px;margin:4px 0 5px;line-height:1.3}
  .snip{font-size:12px;color:#4c5158;line-height:1.45;max-height:5.9em;overflow:hidden}
  .dupline{margin-top:7px;font:10.5px ui-monospace,monospace;color:var(--dup)}
  .delbtn{margin-top:9px;width:100%;border:1px solid var(--rule);background:#fff;color:var(--pencil);
    padding:8px;cursor:pointer;font:600 11px/1 inherit;letter-spacing:.06em;text-transform:uppercase;min-height:38px}
  .delbtn:hover{border-color:var(--del);color:var(--del)}
  .delbtn[aria-pressed="true"]{background:var(--del);border-color:var(--del);color:#fff}
  mark{background:var(--tan-wash);color:var(--brown-dk);font-weight:700;padding-bottom:2px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 8' preserveAspectRatio='none'><path d='M0 5 C 10 8, 18 2, 30 5 S 50 8, 60 4' stroke='%23c255b9' stroke-width='1.6' fill='none' stroke-linecap='round' opacity='.85'/></svg>");
    background-repeat:no-repeat;background-position:0 100%;background-size:100% 6px}
  .empty{padding:60px 0;max-width:46ch}
  .empty .big{font-size:20px;margin:0 0 8px}
  .empty .why{color:var(--pencil);font-size:14px}
  .jumpbar{display:flex;align-items:center;gap:14px;border:2px solid var(--sc);background:#f2f8fc;
    padding:12px 14px;margin-bottom:18px}
  .jumpbar img{width:44px;height:57px;object-fit:cover;object-position:top;border:1px solid var(--rule);background:#fff}
  .jbtext{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .jbtext b{font:700 15px/1 ui-monospace,monospace;color:var(--sc);letter-spacing:.05em}
  .jbtext span{font-size:13px;color:#3b3a36;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jbopen{border:1px solid var(--sc);background:var(--sc);color:#fff;padding:10px 16px;cursor:pointer;
    font:600 13px/1 inherit;min-height:42px;white-space:nowrap}
  .jbopen:hover{background:#255a86}
  .sharebox{border:1px solid var(--sc);background:#f2f8fc;padding:10px 12px;margin-bottom:14px}
  .sharecode{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;flex-wrap:wrap}
  .scl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil)}
  .sharecode b{font:700 19px/1 ui-monospace,monospace;color:var(--sc);letter-spacing:.06em}
  .sharebtns{display:flex;gap:6px}
  .sbtn{flex:1;border:1px solid var(--sc);background:#fff;color:var(--sc);padding:8px;cursor:pointer;
    font:600 11px/1 inherit;min-height:38px;text-transform:uppercase;letter-spacing:.04em}
  .sbtn:hover{background:var(--sc);color:#fff}
  .tryor{border:1px solid var(--brown);background:var(--tan-wash);color:var(--brown-dk);
    padding:4px 10px;border-radius:3px;cursor:pointer;font:600 13px/1 inherit;min-height:32px}
  .tryor:hover{background:#fbe8f4}

  /* ---- scan-in panel ---- */
  .drop{border:2px dashed var(--rule);padding:30px 20px;text-align:center;margin-bottom:20px;border-radius:4px}
  .drop.over{border-color:var(--brown);background:var(--tan-wash)}
  .drop h2{margin:0 0 6px;font-size:17px}
  .drop p{margin:0 0 16px;color:var(--pencil);font-size:13px}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{border:1px solid var(--bar);background:var(--bar);color:#fff;padding:11px 18px;cursor:pointer;
    font:600 13px/1 inherit;min-height:44px}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--bar);color:#fff}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.danger{background:var(--del);border-color:var(--del)}
  .editrow{display:flex;flex-direction:column;gap:6px;padding:9px 11px 11px;border-top:1px solid var(--rule)}
  .editrow input{border:1px solid var(--rule);padding:8px;font:13px inherit;min-height:38px;width:100%}
  .editrow input:focus{outline:2px solid var(--brown);outline-offset:-1px}
  .editrow .row2{display:flex;gap:6px}
  .editrow .row2 button{flex:1;border:1px solid var(--rule);background:#fff;cursor:pointer;font:11px inherit;
    padding:8px;min-height:38px}
  .editrow .row2 button:hover{border-color:var(--brown);color:var(--brown-dk)}
  .flag{margin-top:7px;font:10.5px ui-monospace,monospace;color:var(--del)}
  .busy{font-size:12px;color:var(--pencil);padding:6px 11px}

  /* ---- viewer ---- */
  .viewer{position:fixed;inset:0;background:rgba(26,26,24,.94);z-index:40;display:none;grid-template-columns:1fr 400px}
  .viewer[open]{display:grid}
  .varrow{position:absolute;top:50%;transform:translateY(-50%);z-index:45;border:0;cursor:pointer;
    background:rgba(20,20,18,.45);color:#fff;font-size:36px;line-height:1;padding:16px 11px;border-radius:8px}
  .varrow:hover:not(:disabled){background:rgba(20,20,18,.75)}
  .varrow:disabled{opacity:.2;cursor:default}
  .varrow.left{left:12px} .varrow.right{right:412px}
  .stage{overflow:auto;padding:26px;display:flex;align-items:flex-start;justify-content:center;
    overscroll-behavior:contain;touch-action:pan-x pan-y pinch-zoom}
  .stage img{max-width:100%;background:#fff;box-shadow:0 10px 50px rgba(0,0,0,.5)}
  .stage img.zoom{max-width:none;width:200%}
  .side{background:var(--paper);border-left:3px solid var(--brown);display:flex;flex-direction:column;overflow:hidden}
  .side-head{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
  .tab{background:var(--bar);color:#fff;padding:4px 11px;font:11px ui-monospace,monospace;letter-spacing:.12em}
  .v-ttl{font-weight:700;font-size:14px;flex:1;line-height:1.3}
  .x{border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--pencil);min-width:44px;min-height:44px}
  .side-body{overflow:auto;padding:14px 18px;font-size:13px;line-height:1.7;color:#3b3a36;overscroll-behavior:contain}
  .side-body h3{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin:0 0 8px}
  .kws{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;align-items:center}
  .kws span{border:1px solid var(--rule);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--pencil)}
  .kwchip{display:inline-flex;align-items:center;gap:4px}
  .kwx{border:0;background:transparent;color:var(--pencil);cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 2px}
  .kwx:hover{color:var(--del)}
  .kwadd{border:0!important;padding:0!important}
  #v-kwadd{border:1px dashed var(--rule);border-radius:999px;padding:4px 10px;font:11px inherit;min-width:110px;outline:none}
  #v-kwadd:focus{border-color:var(--brown);border-style:solid}
  .kwedited{border:0!important;color:var(--brown-dk)!important;font-size:10px!important;letter-spacing:.08em;text-transform:uppercase}
  .vbadge{position:absolute;top:6px;right:6px;background:var(--sc);color:#fff;font:700 10px/1 ui-monospace,monospace;
    padding:3px 6px;border-radius:3px;letter-spacing:.04em}
  .vers{margin-bottom:12px}
  .vrow{display:flex;gap:6px;margin-bottom:5px}
  .vsel{flex:1;text-align:left;border:1px solid var(--rule);background:#fff;padding:8px 11px;cursor:pointer;
    font:12px inherit;min-height:40px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .vrow.on .vsel{border-color:var(--sc);color:var(--sc);font-weight:700}
  .vwhen{color:var(--pencil);font-size:10px;font-weight:400}
  .vmake{border:1px solid var(--rule);background:#fff;cursor:pointer;font:10px inherit;padding:0 10px;min-height:40px;
    min-width:88px;text-transform:uppercase;letter-spacing:.04em}
  .vmake:hover{border-color:var(--sc);color:var(--sc)}
  .vreplace{width:100%;border:1px solid var(--sc);background:var(--sc);color:#fff;padding:10px;cursor:pointer;
    font:600 12px/1 inherit;min-height:42px;margin-bottom:6px}
  .vreplace:hover{background:#255a86}

  /* duplicate groups: both scans side by side */
  .dupwrap{display:flex;flex-direction:column;gap:16px}
  .dupgroup{border:1px solid var(--rule);border-left:4px solid var(--dup);background:var(--page)}
  .dghead{display:flex;align-items:baseline;gap:12px;padding:11px 14px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .dgkind{font:700 10px/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dup);
    background:var(--tan-wash);padding:4px 8px;border-radius:3px}
  .dgttl{font-weight:700;font-size:14px}
  .dupcopies{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--rule)}
  .dupcopy{background:var(--page);display:flex;flex-direction:column;padding:12px}
  .dupcopy.c-hi{box-shadow:inset 4px 0 0 var(--hi)}
  .dupcopy.c-lv{box-shadow:inset 4px 0 0 var(--lv)}
  .dupcopy.marked{background:var(--del-wash)}
  .dupcopy.marked .shot img{opacity:.4;filter:grayscale(1)}
  .dupcopy .shot{border:0;background:transparent;padding:0;cursor:pointer;margin-bottom:9px}
  .dupcopy .shot img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border:1px solid var(--rule);background:#fff}
  .dupcopy .shot:focus-visible img{outline:2px solid var(--dup);outline-offset:2px}
  .dcmeta .pg{margin-bottom:8px}
  .keepflag{background:var(--hi);color:#fff;font-size:9px;padding:1px 6px;border-radius:3px;letter-spacing:.05em;
    text-transform:uppercase;font-weight:700;margin-left:4px}
  .dcmeta .delbtn{margin-top:0}
  @media (max-width:760px){
    .dupcopies{grid-template-columns:1fr 1fr}
    .dupcopy{padding:9px}
    .dgttl{font-size:13px}
  }

  /* concepts */
  .card.concept{border-top-color:var(--brown);cursor:pointer}
  .cbk{color:var(--brown-dk)!important}
  .cmeta{padding:12px 13px 14px}
  .cone{font-weight:700;font-size:13px;color:var(--brown-dk);margin:4px 0 7px;line-height:1.35}
  .clearn{margin-top:9px;font-size:11px;font-weight:600;color:var(--brown-dk);letter-spacing:.02em}
  .cbadge{position:absolute;top:6px;left:6px;background:#fff;border:1px solid var(--rule);border-radius:4px;
    font-size:12px;padding:1px 4px;line-height:1.2}
  .vbadge + .cbadge{left:6px}
  #v-concepts h3{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin:0 0 8px}
  .claunch{margin-bottom:14px}
  .cbtn{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:1px solid var(--brown);
    background:var(--tan-wash);color:var(--brown-dk);padding:10px 12px;cursor:pointer;font:600 13px/1.2 inherit;min-height:44px}
  .cbtn small{font-weight:400;color:var(--pencil);font-size:11px}
  .cbtn:hover{background:#fbe8f4}

  .cmodal{position:fixed;inset:0;background:rgba(26,26,24,.6);z-index:50;display:flex;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .cmodal[hidden]{display:none}

    padding:34px 40px 40px;position:relative;box-shadow:0 20px 70px rgba(0,0,0,.4)}
  .cmx{position:absolute;top:12px;right:12px}
  .ceyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil)}
  .ctitle{font:700 27px/1.15 "Segoe UI",-apple-system,Arial,sans-serif;color:var(--ink);margin:6px 0 10px}
  .clede{font-size:17px;font-weight:700;color:var(--brown-dk);line-height:1.4;margin:0 0 22px}
  #c-body h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brown-dk);

  .crel{display:flex;flex-wrap:wrap;gap:6px}

    padding:6px 10px 6px 6px;font:12px inherit;text-align:left;min-height:48px}
  .cpage img{width:34px;height:44px;object-fit:cover;object-position:top;border:1px solid var(--rule)}
  .cpage:hover{border-color:var(--brown)}
  .cpage small{color:var(--pencil)}
  .cnote{margin-top:22px!important;font-size:12px;color:var(--pencil);border-top:1px solid var(--rule);padding-top:14px}

  }
  .copies{margin-bottom:14px}
  .copies .cp{display:flex;gap:6px;margin-bottom:5px}
  .copies .cp button:first-child{flex:1;text-align:left;border:1px solid var(--rule);background:#fff;padding:9px 11px;
    cursor:pointer;font:12px inherit;min-height:40px}
  .copies .cp button:first-child[aria-current="true"]{border-color:var(--dup);color:var(--dup);font-weight:700}
  .copies .cp .mk{border:1px solid var(--rule);background:#fff;cursor:pointer;font:10px inherit;padding:0 10px;

  .copies .cp .mk[aria-pressed="true"]{background:var(--del);border-color:var(--del);color:#fff}

      let r;
      try { r = indexedDB.open('oishi-binders', 3); }
      catch(e){ mode = 'ls'; return res(null); }
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('scans')) d.createObjectStore('scans', {keyPath:'id'});
        if (!d.objectStoreNames.contains('marks')) d.createObjectStore('marks', {keyPath:'id'});
        if (!d.objectStoreNames.contains('kwedits')) d.createObjectStore('kwedits', {keyPath:'id'});
        if (!d.objectStoreNames.contains('versions')) d.createObjectStore('versions', {keyPath:'id'});
      };
      r.onsuccess = () => { db = r.result; res(db); };
      r.onerror = () => { mode = 'ls'; res(null); };
      setTimeout(() => { if (!db && mode === 'idb'){ mode = 'ls'; res(null); } }, 2500);
    });
    const tx = (store, m) => db.transaction(store, m).objectStore(store);
    const lsKey = s => 'oishi-' + s;
    const lsAll = s => { try { return JSON.parse(localStorage.getItem(lsKey(s)) || '[]'); } catch(e){ return []; } };
    const lsPut = (s, arr) => { try { localStorage.setItem(lsKey(s), JSON.stringify(arr)); return true; }
                               catch(e){ return false; } };
    return {
      async init(){ await open(); return mode; },
      mode: () => mode,
      all(store){
        if (mode === 'ls' || !db) return Promise.resolve(lsAll(store));
        return new Promise(res => { const r = tx(store,'readonly').getAll(); r.onsuccess = () => res(r.result||[]); r.onerror = () => res([]); });
      },
      put(store, rec){
        if (mode === 'ls' || !db){ const a = lsAll(store).filter(x => x.id !== rec.id); a.push(rec); return Promise.resolve(lsPut(store,a)); }
        return new Promise(res => { const r = tx(store,'readwrite').put(rec); r.onsuccess = () => res(true); r.onerror = () => res(false); });
      },
      del(store, id){
        if (mode === 'ls' || !db){ return Promise.resolve(lsPut(store, lsAll(store).filter(x => x.id !== id))); }
        return new Promise(res => { const r = tx(store,'readwrite').delete(id); r.onsuccess = () => res(true); r.onerror = () => res(false); });
      }
    };
  })();

  /* ============ data ============ */
  const STATIC = (window.BINDER || []).map(e => ({...e, scan:false}));
  const CONCEPTS = window.CONCEPTS || {};   // concept library: id -> {name, definition, examples, ...}
  let SCANS = [], MARKS = new Set(), KWEDIT = {}, hideDups = true;
  let VERSIONS = {};                 // pageId -> [{v, img, thumb, text, kw, title, note, at}], oldest first
  let PAGES = [], byId = {}, groups = {}, primaryOf = {};

  // the version currently shown for a page (the last one is current), or null for the original
  const curVer = p => { const h = VERSIONS[p.id]; return h && h.length ? h[h.length-1] : null; };
  const baseThumb = p => p.scan ? p.thumb : (window.THUMB ? window.THUMB[p.id] : 'thumbs/' + p.id + '.jpg');
  const basePage  = p => p.scan ? p.img   : (window.PAGEIMG ? window.PAGEIMG[p.id] : 'pages/' + p.id + '.jpg');
  const thumbSrc = p => { const v = curVer(p); return v ? v.thumb : baseThumb(p); };
  const pageSrc  = p => { const v = curVer(p); return v ? v.img   : basePage(p); };
  const verCount = p => (VERSIONS[p.id] ? VERSIONS[p.id].length + 1 : 1);   // +1 for the original

  function rebuild(){
    PAGES = STATIC.concat(SCANS);
    // apply any saved keyword edits over the baked-in keywords
    PAGES.forEach(p => { if (KWEDIT[p.id]) { p.kw = KWEDIT[p.id]; p.kwEdited = true; } });
    // a current version overrides the page's own text/keywords/title for search + display
    PAGES.forEach(p => {
      const v = curVer(p);
      p.curText  = v && v.text ? v.text : p.text;
      p.curKw    = v && v.kw && v.kw.length ? v.kw : p.kw;
      p.curTitle = v && v.title ? v.title : p.title;
    });
    PAGES.forEach(p => p.hay = (p.curTitle + ' ' + p.curKw.join(' ') + ' ' + (p.note||'') + ' ' + p.curText).toLowerCase());
    byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
    groups = {};
    PAGES.forEach(p => { if (p.g) (groups[p.g] = groups[p.g] || []).push(p.id); });
    primaryOf = {};
    Object.values(groups).forEach(ids => {
      const keep = ids.find(i => byId[i].keep) || ids.find(i => i.startsWith('LV-')) || ids.slice().sort()[0];
      ids.forEach(i => primaryOf[i] = keep);
    });
  }
  // a page is a "surplus" duplicate if it belongs to a group but isn't that group's kept copy
  const isSurplus = p => p.g && primaryOf[p.id] && primaryOf[p.id] !== p.id;

  const out = document.getElementById('out'), qEl = document.getElementById('q');
  const statsEl = document.getElementById('stats'), clearEl = document.getElementById('clear');
  let sort = 'rel', tab = 'all', terms = [], results = [], searchMode = 'and', matchMode = 'all';
  let conceptResults = [];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const pad = n => String(n).padStart(3,'0');
  const label = p => p.scan ? 'Scanned' : p.book;

  /* ============ search ============ */
  // Commas separate terms and let a term be multiple words: "parkinson, level up"
  // is two terms, the second a phrase. Whether ALL terms must match or ANY is set
  // by the All/Any toggle (default: all).
  function parse(q){
    searchMode = (matchMode === 'any') ? 'or' : 'and';
    if (q.indexOf(',') !== -1){
      return q.split(',')
              .map(s => s.trim().replace(/^["']|["']$/g, '').toLowerCase())
              .filter(s => s.length > 1);
    }
    const t = [], re = /"([^"]+)"|(\S+)/g; let m;
    while ((m = re.exec(q))) { const s = (m[1]||m[2]).toLowerCase().trim(); if (s.length > 1) t.push(s); }
    return t;
  }
  function count(hay, n){ let c=0,i=hay.indexOf(n); while(i!==-1){c++;i=hay.indexOf(n,i+n.length);} return c; }

  // A page code the class can be told out loud: just the number, "47".
  // Old-style codes (HI-047 / LV 12) still work so nothing breaks.
  function codeToId(q){
    const s = String(q).trim();
    const plain = s.match(/^#?\s*(\d{1,4})$/);
    if (plain){
      const n = parseInt(plain[1], 10);
      const hit = PAGES.find(p => p.num === n);
      return hit ? hit.id : null;
    }
    const m = s.match(/^(hi|hawaii|lv|lasvegas|las vegas|vegas)[\s\-_.#]*(\d{1,4})$/i);
    if (!m) return null;
    const w = m[1].toLowerCase().replace(/\s/g,'');
    const pre = (w === 'hi' || w === 'hawaii') ? 'HI' : 'LV';
    const id = pre + '-' + String(parseInt(m[2],10)).padStart(3,'0');
    return byId[id] ? id : null;
  }
  const codeOf = p => (p.num != null ? String(p.num) : (p.scan ? 'new' : pad(p.p)));
  function snippet(p, max){
    const T = p.curText || p.text || '';
    const spans = [];
    for (const t of terms){
      const i = T.toLowerCase().indexOf(t);
      if (i === -1) continue;
      spans.push([Math.max(0,i-70), Math.min(T.length, i+t.length+120)]);
    }
    spans.sort((a,b)=>a[0]-b[0]);
    const m = [];
    for (const s of spans){
      const l = m[m.length-1];
      if (l && s[0] <= l[1]+20) l[1] = Math.max(l[1], s[1]); else m.push(s.slice());
    }
    if (!m.length) return (p.note || T || '').slice(0,170);
    return m.slice(0,max).map(([a,b]) => T.slice(a,b)).join(' … ');
  }
  const hl = s => { s = esc(s); return terms.length ? s.replace(new RegExp('('+terms.map(rxEsc).join('|')+')','gi'),'<mark>$1</mark>') : s; };

  const dedupe = list => hideDups ? list.filter(p => !isSurplus(p)) : list;
  const scopes = {
    all:    () => dedupe(PAGES),
    dup:    () => Object.values(groups).map(ids => byId[primaryOf[ids[0]]] || byId[ids[0]]).filter(Boolean),
    scan:   () => SCANS,
    marked: () => [...MARKS].map(id => byId[id]).filter(Boolean),
    concepts: () => Object.entries(CONCEPTS).map(([cid,c]) => byId[c.pages.find(i=>byId[i])]).filter(Boolean)
  };
  function tabDefs(){
    const vis = dedupe(PAGES).length;
    return [
      ['all','Everything', vis],
      ['concepts','Concepts', PAGES.length ? Object.keys(CONCEPTS).length : 0],
      ...(Object.keys(groups).length ? [['dup','Duplicates', Object.keys(groups).length]] : []),
      ['scan','Add scan', SCANS.length]
    ];
  }
  function paintTabs(){
    document.getElementById('tabs').innerHTML = tabDefs().map(([k,l,n]) =>
      `<button role="tab" data-tab="${k}" aria-selected="${k===tab}">${l}<span class="n">${n}</span></button>`).join('');
  }
  function paintChips(){
    const f = {};
    PAGES.forEach(p => (p.curKw||p.kw).forEach(w => f[w] = (f[w]||0)+1));
    const c = Object.entries(f).filter(([w,n]) => n >= 3).sort((a,b)=>b[1]-a[1]).slice(0,12).map(e=>e[0]);
    document.getElementById('chips').innerHTML = c.map(x => `<button class="chip">${x}</button>`).join('');
  }

  function rangeOf(q){
    const m = String(q||'').trim().match(/^#?\s*(\d{1,4})\s*(?:-|\u2013|\u2014|:|to)\s*(\d{1,4})\s*$/i);
    if (!m) return null;
    let a = parseInt(m[1],10), b = parseInt(m[2],10);
    if (a > b) [a,b] = [b,a];
    return [a,b];
  }
  let fuzzedNote = null;   // {from, to} when a typo was auto-corrected
  let VOCAB = null;        // first-letter buckets of [word, freq] from titles/keywords/text
  function buildVocab(){
    const freq = Object.create(null);
    for (const p of PAGES){
      const words = ((p.title||'') + ' ' + (p.kw||[]).join(' ') + ' ' + (p.text||''))
        .toLowerCase().match(/[a-z]{4,}/g) || [];
      for (const w of words) freq[w] = (freq[w]||0) + 1;
    }
    VOCAB = Object.create(null);
    for (const w in freq){
      (VOCAB[w[0]] = VOCAB[w[0]] || []).push([w, freq[w]]);
    }
  }
  function editDist(a, b, max){           // Levenshtein with cutoff
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({length: b.length + 1}, (_, i) => i);
    for (let i = 1; i <= a.length; i++){
      const cur = [i];
      let rowMin = i;
      for (let j = 1; j <= b.length; j++){
        cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
        if (cur[j] < rowMin) rowMin = cur[j];
      }
      if (rowMin > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }
  function fixTerm(t){
    if (!/^[a-z]{4,}$/.test(t)) return null;
    if (!VOCAB) buildVocab();
    const max = t.length <= 5 ? 1 : 2;
    let best = null, bestD = max + 1, bestF = 0;
    for (const [w, f] of (VOCAB[t[0]] || [])){
      if (w === t) return null;           // the word exists — nothing to fix
      const d = editDist(t, w, max);
      if (d < bestD || (d === bestD && f > bestF)){ best = w; bestD = d; bestF = f; }
    }
    return bestD <= max ? best : null;
  }
  function runTerms(termsArr, pool){
    const res = []; let hits = 0;
    for (const p of pool){
      let sc = 0, matched = 0;
      for (const t of termsArr){
        const c = count(p.hay, t);
        if (!c) { if (searchMode === 'and') { matched = -1; break; } continue; }
        matched++;
        sc += c + ((p.curTitle||p.title).toLowerCase().includes(t) ? 6 : 0) + ((p.curKw||p.kw).includes(t) ? 3 : 0);
      }
      const ok = searchMode === 'or' ? matched > 0 : matched === termsArr.length;
      if (ok){
        p.score = sc + (searchMode === 'or' ? matched * 100 : 0);
        p.matchedCount = Math.max(matched, 0);
        hits += sc; res.push(p);
      }
    }
    return { res, hits };
  }
  function search(){
    const t0 = performance.now();
    const pool = scopes[tab]() || [];
    let hits = 0;
    fuzzedNote = null;
    if (tab === 'concepts'){
      // match only the concept itself (name / one-liner / its own search terms), on word boundaries
      const hayC = c => [c.name, c.one_line, c.search_terms || ''].join(' ').toLowerCase();
      const hitT = (hay, t) => new RegExp('\\b' + rxEsc(t)).test(hay);
      conceptResults = Object.entries(CONCEPTS).filter(([cid, c]) => {
        if (!terms.length) return true;
        const hay = hayC(c);
        const n = terms.filter(t => hitT(hay, t)).length;
        return searchMode === 'or' ? n > 0 : n === terms.length;
      });
      if (terms.length) conceptResults.sort((a, b) => {
        const nm = e => terms.some(t => e[1].name.toLowerCase().indexOf(t) !== -1) ? 0 : 1;
        return nm(a) - nm(b);
      });
      results = conceptResults.map(([cid, c]) => byId[c.pages.find(i => byId[i])]).filter(Boolean);
      return { ms: Math.max(1, Math.round(performance.now() - t0)), hits: conceptResults.length };
    }
    const rng = rangeOf(qEl.value);
    if (rng){
      // page-range query: show pages a..b in binder order (all copies, nothing hidden)
      results = PAGES.filter(p => p.num >= rng[0] && p.num <= rng[1]).sort((x,y) => x.num - y.num);
      return { ms: Math.max(1, Math.round(performance.now()-t0)), hits: results.length };
    }
    if (!terms.length) results = pool.slice();
    else {
      let run = runTerms(terms, pool);
      if (!run.res.length){
        // nothing found — try correcting likely typos ("kanbam" -> "kanban")
        const corrected = terms.map(t => fixTerm(t) || t);
        if (corrected.some((t, i) => t !== terms[i])){
          const retry = runTerms(corrected, pool);
          if (retry.res.length){
            fuzzedNote = { from: terms.join(' '), to: corrected.join(' ') };
            terms = corrected;            // so snippets and highlights match what we searched
            run = retry;
          }
        }
      }
      results = run.res; hits = run.hits;
    }
    results.sort((a,b) => sort==='rel' && terms.length ? (b.score-a.score || a.id.localeCompare(b.id)) : a.id.localeCompare(b.id));
    return { ms: Math.max(1, Math.round(performance.now()-t0)), hits };
  }

  function dupLine(p){
    if (!p.g || !groups[p.g]) return '';
    const o = groups[p.g].filter(i => i !== p.id);
    return o.length ? `<div class="dupline">also in: ${o.map(i => 'p. '+pad(byId[i].p)).join(' · ')}</div>` : '';
  }
  function cardHTML(p, opts={}){
    const cls = (tab==='dup' ? 'b-dup' : p.scan ? 'b-sc' : 'b-hi')
              + (MARKS.has(p.id) ? ' marked' : '');
    const del = opts.del ? `<button class="delbtn" data-mark="${p.id}" aria-pressed="${MARKS.has(p.id)}">
        ${MARKS.has(p.id) ? '✓ Marked for delete' : 'Mark for delete'}</button>` : '';
    const nv = verCount(p);
    const vbadge = nv > 1 ? `<span class="vbadge">v${nv}</span>` : '';
    const cbadge = (p.concepts && p.concepts.length) ? `<span class="cbadge" title="Has a Learn more explainer">📘</span>` : '';
    return `<div class="card ${cls}">
      <button class="shot" data-id="${p.id}" aria-label="Open ${esc(p.curTitle||p.title)}"><img loading="lazy" src="${thumbSrc(p)}" alt="">${vbadge}${cbadge}</button>
      <div class="meta">
        <div class="pg"><span class="pnum">${codeOf(p)}</span><span class="bk">${label(p)}</span></div>
        <div class="ttl">${hl(p.curTitle||p.title)}</div>
        <div class="snip">${hl(snippet(p,2))}</div>
        ${dupLine(p)}${p.dupOf ? `<div class="flag">looks like ${p.dupOf}</div>` : ''}${del}
      </div>${opts.edit ? editHTML(p) : ''}</div>`;
  }
  function editHTML(p){
    return `<div class="editrow">
      <input data-ttl="${p.id}" value="${esc(p.title)}" placeholder="Title this page" aria-label="Title">
      <input data-kw="${p.id}" value="${esc(p.kw.join(', '))}" placeholder="Keywords, comma separated" aria-label="Keywords">
      <div class="row2">
        <button data-ocr="${p.id}">Read text</button>
        <button data-rm="${p.id}">Remove</button>
      </div></div>`;
  }

  // one card per duplicate GROUP, showing every copy (Hawaii + Las Vegas) side by side
  function dupGroupHTML(gid){
    const ids = (groups[gid] || []).slice().sort((a,b) => {   // Hawaii first, then Las Vegas
      const rank = i => (byId[i].book === 'Hawaii' ? 0 : 1);
      return rank(a) - rank(b) || a.localeCompare(b);
    });
    if (!ids.length) return '';
    const kept = primaryOf[ids[0]];
    const p0 = byId[ids[0]];
    const books = [...new Set(ids.map(i => byId[i].book))];
    const kind = 'Repeated';
    const copies = ids.map(i => {
      const p = byId[i];
      const isKept = i === kept;
      const marked = MARKS.has(i);
      return `<div class="dupcopy ${marked?'marked':''} c-hi">
        <button class="shot" data-id="${i}" aria-label="Open ${label(p)} page ${pad(p.p)}"><img loading="lazy" src="${thumbSrc(p)}" alt=""></button>
        <div class="dcmeta">
          <div class="pg"><span class="pnum">${codeOf(p)}</span><span class="bk">${label(p)}</span>${isKept?' <span class="keepflag">keep</span>':''}</div>
          <button class="delbtn" data-mark="${i}" aria-pressed="${marked}">${marked?'✓ Marked for delete':'Mark for delete'}</button>
        </div></div>`;
    }).join('');
    return `<div class="dupgroup">
      <div class="dghead"><span class="dgkind">${kind}</span><span class="dgttl">${hl(p0.curTitle||p0.title)}</span></div>
      <div class="dupcopies">${copies}</div>
    </div>`;
  }

  /* ============ render ============ */
  let tocOpen = !matchMedia('(max-width:700px)').matches;
  function tocHTML(){
    const rows = Object.entries(CONCEPTS)
      .map(([cid, c]) => {
        const nums = (c.pin || []).map(i => byId[i] && byId[i].num).filter(Boolean);
        if (!nums.length) return null;
        const a = Math.min(...nums), b = Math.max(...nums);
        return { cid, name: c.name, a, b };
      })
      .filter(Boolean)
      .sort((x, y) => x.a - y.a);
    return `<details class="toc" id="tocbox"${tocOpen ? ' open' : ''}>
      <summary>Table of contents — the binder, in teaching order</summary>
      <div class="tocgrid">` + rows.map(r =>
        `<button class="tocrow" data-range="${r.a}-${r.b}">
           <span class="tocpg">${r.a === r.b ? r.a : r.a + '–' + r.b}</span>
           <span class="tocname">${esc(r.name)}</span>
         </button>`).join('') + `</div></details>`;
  }
  function render(){
    terms = rangeOf(qEl.value) ? [] : parse(qEl.value.trim());
    const info = search();
    clearEl.hidden = !qEl.value;
    paintTabs();

    const unit = tab === 'dup' ? 'group' : (tab === 'concepts' ? 'concept' : 'page');
    const modeNote = terms.length > 1
      ? (searchMode === 'or' ? ` · any of ${terms.length} words` : ` · all ${terms.length} words`)
      : '';
    statsEl.textContent = terms.length
      ? `${results.length} ${unit}${results.length===1?'':'s'} · ${info.hits} hits${modeNote} · ${info.ms} ms`
      : `${results.length} ${unit}${results.length===1?'':'s'} · type to search — separate words with commas`;

    let head = '';
    if (fuzzedNote && tab !== 'concepts')
      head += `<p class="fuzznote">No matches for “<b>${esc(fuzzedNote.from)}</b>” — showing results for “<b>${esc(fuzzedNote.to)}</b>”.</p>`;
    if (tab === 'all' && !qEl.value.trim())
      head = tocHTML() + head;
    let jumpHTML = '';
    const jumpId = codeToId(qEl.value);
    if (jumpId){
      const jp = byId[jumpId];
      jumpHTML = `<div class="jumpbar">
        <img src="${thumbSrc(jp)}" alt="">
        <div class="jbtext"><b>Page ${codeOf(jp)}</b><em>${label(jp)} · binder p.${pad(jp.p)}</em><span>${esc(jp.curTitle || jp.title)}</span></div>
        <button class="jbopen" data-jump="${jumpId}">Open this page →</button>
      </div>`;
    }
    if (tab === 'dup'){
      head = `<p class="note"><b>${Object.keys(groups).length} duplicate groups.</b>
        These are pages that appear in the binder more than once.
        Each row below shows every copy side by side so you can compare them.
        The copy tagged <b>keep</b> is the one kept in the other tabs; use <b>Mark for delete</b> under the copy you want to drop.
        Marks build a list you can export from the <b>Marked for delete</b> tab.</p>`;
    }
    if (tab === 'scan'){
      const m = DB.mode();
      head = `<div class="drop" id="drop">
          <h2>Scan a page in</h2>
          <p>Use your phone camera, or drop image files here. Pages are read on this device — nothing is uploaded.</p>
          <div class="btns">
            <button class="btn" id="b-cam">Take photo</button>
            <button class="btn ghost" id="b-file">Choose files</button>
            <button class="btn ghost" id="b-export" ${(SCANS.length||Object.keys(VERSIONS).length)?'':'disabled'}>Export scans &amp; versions</button>
          </div>
        </div>
        <p class="note"><b>These scans live in this browser only.</b> They are saved on this device
        (${m==='idb'?'IndexedDB':'local storage'}) and stay searchable next time you open the file here — but they are not
        in the shared archive and nobody else can see them. Use <b>Export</b> to get them off the device as a file.
        <b>Read text</b> makes a scan searchable by its words; it needs internet the first time, and works without it if you
        type keywords yourself.</p>` + head;
    }
    if (tab === 'marked'){
      head = MARKS.size ? `<p class="note warn"><b>${MARKS.size} page${MARKS.size===1?'':'s'} marked for delete.</b>
          Nothing is deleted here — this is a list to act on. The scans on disk are untouched.
          <span style="display:block;margin-top:10px">
          <button class="btn" id="b-copy">Copy list</button>
          <button class="btn ghost" id="b-csv">Download CSV</button>
          <button class="btn ghost danger" id="b-unmark">Unmark all</button></span></p>`
        : `<p class="note"><b>Nothing marked yet.</b> Open the Duplicates tab and mark the copies you want dropped —
           usually the second copy of a page that got scanned twice.</p>`;
    }

    if (tab === 'concepts'){
      head = terms.length
        ? `<p class="note"><b>${conceptResults.length} of ${Object.keys(CONCEPTS).length} concepts</b> match your search. Open one to read it in full.</p>`
        : `<p class="note"><b>${Object.keys(CONCEPTS).length} concepts and topic groups, expanded.</b>
        Each is pulled from the scans and expanded with a plain-language definition, examples, and why it matters —
        so you can learn the idea, not just find the page. Open one to read it in full.</p>`;
    }

    // the jump banner sits above whatever note the tab produced
    head = jumpHTML + head;

    // archive is empty (no documents loaded yet) — show a clear waiting state, not a "no match"
    if (!PAGES.length && !terms.length){
      out.innerHTML = head + `<div class="empty">
        <p class="big">No documents loaded yet.</p>
        <p class="why">This archive is ready and waiting for the scans.
        Once the new binder is processed and <code>data.js</code> is added, the pages appear here —
        search, numbering, duplicates and everything else switch on automatically.</p>
        <p class="why">You can still use the <b>Scan in</b> tab to add pages from this device right now.</p>
        </div>`;
      wire();
      return;
    }

    if (tab === 'concepts' && !conceptResults.length){
      out.innerHTML = head + `<div class="empty"><p class="big">No concept matches <strong>${esc(qEl.value)}</strong>.</p>
        <p class="why">Try a single word, or search the Everything tab to look inside the pages themselves.</p></div>`;
      wire();
      return;
    }
    if (!results.length && !(tab === 'concepts' && conceptResults.length)){
      let hint = '';
      if (searchMode === 'and' && terms.length > 1){
        // say WHICH word is the one nothing has, so the search can be fixed intelligently
        const pool = scopes[tab]() || [];
        const found = terms.filter(t => pool.some(p => p.hay.indexOf(t) !== -1));
        const missing = terms.filter(t => !found.includes(t));
        const detail = missing.length
          ? `<b>${esc(missing.join(', '))}</b> ${missing.length===1?'appears':'appear'} nowhere in this tab.`
          : `Each word appears on its own, but no single page carries all ${terms.length}.`;
        hint = `<p class="why">${detail}
          <button class="tryor" data-tryany="1">Try any word instead</button> — that finds pages with at least one of them.</p>`;
      }
      out.innerHTML = head + (tab==='scan' || tab==='marked' ? '' :
        `<div class="empty"><p class="big">No page has all of <strong>${esc(qEl.value)}</strong>.</p>
         ${hint}
         <p class="why">Words are read off scans, so handwriting and faint toner come through imperfectly.
         Try fewer words, or a shorter one.</p></div>`);
      wire();
      return;
    }
    if (tab === 'concepts'){
      out.innerHTML = head + '<div class="grid">' + conceptResults.map(([cid,c]) => {
        const pageCount = c.pages.filter(i=>byId[i]).length;
        return `<div class="card concept" data-concept="${cid}" tabindex="0" role="button" aria-label="Learn about ${esc(c.name)}">
          <div class="cmeta">
            <div class="pg"><span class="bk cbk">Concept</span> · ${pageCount} page${pageCount===1?'':'s'}</div>
            <div class="ttl">${hl(c.name)}</div>
            <div class="cone">${hl(c.one_line)}</div>
            <div class="snip">${hl(c.definition.slice(0,150))}…</div>
            <div class="clearn">Read the full explainer →</div>
          </div></div>`;
      }).join('') + '</div>';
      wire();
      return;
    }
    if (tab === 'dup'){
      // results holds one representative page per matching group; render each group's copies side by side,
      // cross-binder (Hawaii + Las Vegas) matches first since those are the ones spanning both binders
      const gids = [...new Set(results.map(p => p.g).filter(Boolean))];
      const isCross = g => new Set((groups[g]||[]).map(i => byId[i].book)).size > 1;
      gids.sort((a,b) => (isCross(b)-isCross(a)) || (a-b));
      out.innerHTML = head + '<div class="dupwrap">' + gids.map(dupGroupHTML).join('') + '</div>';
      wire();
      return;
    }
    out.innerHTML = head + '<div class="grid">' +
      results.map(p => cardHTML(p, {edit: tab==='scan'})).join('') + '</div>';
    wire();
  }

  /* ============ scanning in ============ */
  const filepick = document.getElementById('filepick'), campick = document.getElementById('campick');

  function shrink(file, maxPx, q){
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, maxPx / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('not an image')); };
      img.src = url;
    });
  }

  /* ============ versions ============ */
  let versionTargetId = null;

  async function addVersion(id, file){
    const p = byId[id]; if (!p) return;
    try{
      const [img, thumb] = await Promise.all([shrink(file, 1400, .72), shrink(file, 300, .6)]);
      const rec = { v: Date.now(), at: Date.now(), img, thumb, text: '', kw: [],
                    title: p.curTitle || p.title, note: 'New version added ' + new Date().toLocaleDateString() };
      VERSIONS[id] = (VERSIONS[id] || []).concat(rec);
      await DB.put('versions', { id, list: VERSIONS[id] });
      rebuild();
      viewingVer = null;                 // jump to the new current version
      render();
      if (viewer.hasAttribute('open')) paint(id);
      // offer to read the new version's text
      if (confirm('Version v' + (VERSIONS[id].length+1) + ' is now current. Read its text now so it is searchable?')) ocr(id);
    } catch(e){ alert('Could not read that image — is it a photo or scan?'); }
  }

  async function makeVersionCurrent(id, verIdx){
    // verIdx is 0=original, 1=first stored version, ...; "make current" re-appends a copy so history is preserved
    const p = byId[id]; if (!p) return;
    const hist = VERSIONS[id] || [];
    let src;
    if (verIdx === 0) src = { img: basePage(p), thumb: baseThumb(p), text: p.text, kw: p.kw, title: p.title };
    else src = hist[verIdx-1];
    if (!src) return;
    const rec = { v: Date.now(), at: Date.now(), img: src.img, thumb: src.thumb,
                  text: src.text||'', kw: (src.kw||[]).slice(), title: src.title||p.title,
                  note: 'Restored v' + (verIdx+1) + ' as current on ' + new Date().toLocaleDateString() };
    VERSIONS[id] = hist.concat(rec);
    await DB.put('versions', { id, list: VERSIONS[id] });
    rebuild(); viewingVer = null; render();
    if (viewer.hasAttribute('open')) paint(id);
  }

  // cheap term-overlap check against the existing archive
  function looksLikeDup(text){
    const t = new Set(text.toLowerCase().match(/[a-z]{4,}/g) || []);
    if (t.size < 12) return null;
    let best = null, bs = 0;
    for (const p of STATIC){
      const o = new Set(p.text.toLowerCase().match(/[a-z]{4,}/g) || []);
      if (o.size < 12) continue;
      let hit = 0; t.forEach(w => { if (o.has(w)) hit++; });
      const s = hit / Math.min(t.size, o.size);
      if (s > bs){ bs = s; best = p; }
    }
    return bs >= 0.5 ? `${best.book} p. ${pad(best.p)} (${Math.round(bs*100)}% of words match)` : null;
  }

  async function addFiles(files){
    const list = [...files].filter(f => f.type.startsWith('image/'));
    if (!list.length) return;
    out.querySelector('#drop')?.classList.remove('over');
    for (const f of list){
      try{
        const [img, thumb] = await Promise.all([shrink(f, 1400, .72), shrink(f, 300, .6)]);
        const rec = { id:'SC-'+Date.now()+'-'+Math.random().toString(36).slice(2,6), scan:true,
                      book:'Scanned', p:SCANS.length+1, title:f.name.replace(/\.[^.]+$/,'').slice(0,58) || 'Scanned page',
                      kw:[], text:'', note:'Scanned in on '+new Date().toLocaleDateString(), g:0, img, thumb };
        const ok = await DB.put('scans', rec);
        if (!ok){ alert('This device would not save the scan — storage is full or blocked. It is loaded for now but will not persist.'); }
        SCANS.push(rec);
      } catch(e){ alert('Could not read ' + f.name + ' — is it an image?'); }
    }
    rebuild(); render();
  }

  async function ocr(id){
    const p = byId[id]; if (!p) return;
    const hist = VERSIONS[id] || [];
    const cur = hist.length ? hist[hist.length-1] : null;   // OCR the current version if there is one
    const imgToRead = cur ? cur.img : (p.scan ? p.img : basePage(p));
    const btn = out.querySelector(`[data-ocr="${id}"]`);
    if (btn){ btn.disabled = true; btn.textContent = 'Reading…'; }
    try{
      if (!window.Tesseract){
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
          s.onload = res; s.onerror = () => rej(new Error('offline'));
          document.head.appendChild(s);
        });
      }
      const r = await window.Tesseract.recognize(imgToRead, 'eng');
      const text = (r.data.text || '').split(/\s+/).join(' ').trim();
      const freq = {};
      (text.toLowerCase().match(/[a-z]{4,}/g) || []).forEach(w => freq[w] = (freq[w]||0)+1);
      const kw = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);
      if (cur){                                    // store on the current version
        cur.text = text; cur.kw = kw;
        await DB.put('versions', { id, list: hist });
      } else {                                     // store on the page/scan itself
        p.text = text; p.kw = kw; p.dupOf = looksLikeDup(text);
        if (p.scan) await DB.put('scans', p);
      }
      rebuild(); render();
      if (viewer.hasAttribute('open') && shownId === id) paint(id);
    } catch(e){
      alert('Reading the text needs internet the first time (it downloads the OCR engine). '
          + 'You can still type a title and keywords and the page will be searchable by those.');
      if (btn){ btn.disabled = false; btn.textContent = 'Read text'; }
    }
  }

  function exportScans(){
    const out = {
      scans: SCANS.map(p => ({id:p.id, title:p.title, keywords:p.kw, text:p.text, added:p.note, image:p.img})),
      versions: Object.entries(VERSIONS).map(([id, list]) => ({
        page: id,
        current: list.length + 1,
        history: list.map((v,i) => ({v:i+2, added:v.note, title:v.title, keywords:v.kw, text:v.text, image:v.img}))
      }))
    };
    dl(new Blob([JSON.stringify(out, null, 2)], {type:'application/json'}),
       'oishi-scans-and-versions-' + new Date().toISOString().slice(0,10) + '.json');
  }
  function exportMarks(csv){
    const rows = [...MARKS].map(id => byId[id]).filter(Boolean);
    if (csv){
      const body = [['binder','page','title','duplicate_group','also_in']].concat(rows.map(p => [
        label(p), pad(p.p), '"'+p.title.replace(/"/g,'""')+'"', p.g || '',
        '"'+((groups[p.g]||[]).filter(i=>i!==p.id).map(i => label(byId[i])+' p.'+pad(byId[i].p)).join('; '))+'"'
      ])).map(r => r.join(',')).join('\n');
      dl(new Blob([body], {type:'text/csv'}), 'oishi-marked-for-delete.csv');
    } else {
      const txt = rows.map(p => `${label(p)} p.${pad(p.p)} — ${p.title}` +
        ((groups[p.g]||[]).filter(i=>i!==p.id).length ? `  (keep: ${(groups[p.g]||[]).filter(i=>i!==p.id).map(i=>label(byId[i])+' p.'+pad(byId[i].p)).join(', ')})` : '')).join('\n');
      navigator.clipboard?.writeText(txt).then(
        () => alert('Copied ' + rows.length + ' pages to the clipboard.'),
        () => prompt('Copy this list:', txt));
    }
  }
  function dl(blob, name){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  async function saveKw(id, list){
    const p = byId[id]; if (!p) return;
    const kw = list.slice(0, 12);
    const hist = VERSIONS[id] || [];
    if (hist.length){                                 // edit the current version's keywords
      hist[hist.length-1].kw = kw;
      await DB.put('versions', { id, list: hist });
    } else {
      p.kw = kw; p.kwEdited = true; KWEDIT[id] = kw;
      if (p.scan){ await DB.put('scans', p); }
      else { await DB.put('kwedits', {id, kw}); }
    }
    rebuild();
    paintChips();
    if (viewer.hasAttribute('open') && shownId === id) paint(id);
    render();
  }

  async function toggleMark(id){
    if (MARKS.has(id)){ MARKS.delete(id); await DB.del('marks', id); }
    else {
      // marking the last surviving copy would lose the document, not de-duplicate it
      const p = byId[id];
      const sibs = p && p.g ? (groups[p.g] || []) : [];
      if (sibs.length > 1 && sibs.every(i => i === id || MARKS.has(i))){
        const others = sibs.filter(i => i !== id).map(i => label(byId[i]) + ' p.' + pad(byId[i].p)).join(', ');
        if (!confirm('That marks every copy of this page — ' + others + ' ' +
                     (sibs.length > 2 ? 'are' : 'is') + ' already marked, so the document would be gone entirely.\n\n' +
                     'Mark it anyway?')) return;
      }
      MARKS.add(id); await DB.put('marks', {id, at: Date.now()});
    }
    render();
    if (viewer.hasAttribute('open') && shownId) paint(shownId);
  }

  /* ============ viewer ============ */
  const viewer = document.getElementById('viewer'), vImg = document.getElementById('v-img');
  const vTab = document.getElementById('v-tab'), vTtl = document.getElementById('v-ttl');
  const vText = document.getElementById('v-text'), vKws = document.getElementById('v-kws');
  const vCopies = document.getElementById('v-copies'), vPrev = document.getElementById('v-prev');
  const vNext = document.getElementById('v-next'), side = document.getElementById('v-side');
  const sheetBtn = document.getElementById('v-sheet');
  let vi = -1, shownId = null, viewingVer = null;   // viewingVer: version index being shown, null = current

  // resolve what to display for page p at the currently-viewed version
  function viewData(p){
    const hist = VERSIONS[p.id] || [];
    // versions array is [v2, v3, ...]; the "original" is version 1
    if (viewingVer === null || viewingVer === hist.length){          // current (newest)
      const v = hist[hist.length-1];
      return { img: v?v.img:basePage(p), thumb: v?v.thumb:baseThumb(p),
               text: v&&v.text?v.text:p.text, kw: v&&v.kw&&v.kw.length?v.kw:p.kw,
               title: v&&v.title?v.title:p.title, note: v?v.note:p.note, vnum: hist.length+1, current:true };
    }
    if (viewingVer === 0){                                            // original, version 1
      return { img: basePage(p), thumb: baseThumb(p), text: p.text, kw: p.kw,
               title: p.title, note: p.note, vnum: 1, current: hist.length===0 };
    }
    const v = hist[viewingVer-1];                                     // an intermediate stored version
    return { img: v.img, thumb: v.thumb, text: v.text||'', kw: v.kw||[], title: v.title||p.title,
             note: v.note, vnum: viewingVer+1, current:false };
  }

  function paint(id){
    const p = byId[id]; if (!p) return;
    shownId = id;
    const hist = VERSIONS[p.id] || [];
    const nv = hist.length + 1;
    const d = viewData(p);

    vImg.src = d.img; vImg.alt = label(p) + ' page ' + p.p + (nv>1 ? ' version ' + d.vnum : '');
    vImg.classList.remove('zoom');
    document.querySelector('.stage').scrollTop = 0;
    vTab.textContent = codeOf(p) + (nv>1 ? ' · v'+d.vnum : '');
    vTtl.textContent = d.title;

    // keyword editing only edits the CURRENT version; older ones are read-only
    if (d.current){
      vKws.innerHTML = d.kw.map((w,idx) =>
          `<span class="kwchip">${esc(w)}<button class="kwx" data-kwremove="${idx}" aria-label="Remove keyword ${esc(w)}">×</button></span>`).join('')
        + `<span class="kwadd"><input id="v-kwadd" placeholder="+ add keyword" aria-label="Add keyword"></span>`
        + (p.kwEdited ? '<span class="kwedited">edited</span>' : '');
    } else {
      vKws.innerHTML = d.kw.map(w => `<span>${esc(w)}</span>`).join('') || '<span>none</span>';
    }
    vText.innerHTML = (d.note ? '<em>'+esc(d.note)+'</em><br><br>' : '') +
                      (d.text ? hl(d.text) : '<em>No text has been read from this page yet.</em>');

    // ---- version history block ----
    let vh = `<h3>Versions</h3><div class="vers">`;
    for (let k = nv; k >= 1; k--){
      const isCur = k === nv, viewing = (viewingVer===null && isCur) || viewingVer === (k-1);
      const when = k===1 ? 'original' : (hist[k-2]?.at ? new Date(hist[k-2].at).toLocaleDateString() : '');
      vh += `<div class="vrow ${viewing?'on':''}">
        <button class="vsel" data-ver="${k-1}" aria-current="${viewing}">v${k}${isCur?' · current':''}<span class="vwhen">${when}</span></button>`;
      if (!isCur) vh += `<button class="vmake" data-makecur="${k-1}" title="Make this the current version">Make current</button>`;
      vh += `</div>`;
    }
    vh += `</div><button class="vreplace" data-replace="${p.id}">Replace with new version…</button>`;
    document.getElementById('v-versions').innerHTML = vh;

    // the code to call out to the class, plus a link to send them
    document.getElementById('v-share').innerHTML =
      `<div class="sharebox">
         <div class="sharecode">
           <span class="scl">Tell the class</span>
           <b id="sharecodeval">${codeOf(p)}</b>
         </div>
         <div class="sharebtns">
           <button class="sbtn" data-copycode="${codeOf(p)}">Copy code</button>
           <button class="sbtn" data-copylink="${id}">Copy link</button>
         </div>
       </div>`;

    // concepts this page belongs to — home group first, click-through to the Concepts tab
    const isHome = c => (CONCEPTS[c].pin || []).indexOf(p.id) !== -1;
    const rangeTxt = c => {
      const nums = (CONCEPTS[c].pin || []).map(i => byId[i] && byId[i].num).filter(Boolean).sort((a,b)=>a-b);
      if (!nums.length) return '';
      return nums.length === 1 ? ` · page ${nums[0]}` : ` · pages ${nums[0]}–${nums[nums.length-1]}`;
    };
    const cids = (p.concepts || []).filter(c => CONCEPTS[c]).sort((a,b) => (isHome(a)?0:1) - (isHome(b)?0:1));
    document.getElementById('v-concepts').innerHTML = cids.length
      ? '<h3>Concepts on this page</h3><div class="claunch">' + cids.map(c =>
          `<button class="cbtn" data-concept="${c}">📘 ${esc(CONCEPTS[c].name)}
           <small>${isHome(c) ? 'this page\u2019s group' + rangeTxt(c) : 'related concept'} · tap to see all its pages</small></button>`).join('') + '</div>'
      : '';

    vCopies.innerHTML = p.g && groups[p.g]
      ? '<h3>Copies of this page — mark the one to drop</h3><div class="copies">' + groups[p.g].map(i =>
          `<div class="cp"><button data-copy="${i}" aria-current="${i===id}">Page ${codeOf(byId[i])} · ${label(byId[i])}</button>
           <button class="mk" data-mark="${i}" aria-pressed="${MARKS.has(i)}">${MARKS.has(i)?'✓ Marked':'Delete'}</button></div>`).join('') + '</div>'
      : '';
  }
  function show(id){
    vi = results.findIndex(p => p.id === id);
    // a page opened by code or link may not be in the current result list — widen the list so it still opens
    if (vi === -1){ navLabel = null; results = (scopes[tab]() || PAGES).slice(); vi = results.findIndex(p => p.id === id); }
    if (vi === -1){ results = PAGES.slice(); vi = results.findIndex(p => p.id === id); }
    if (vi === -1) return;
    viewingVer = null;              // always open on the current version
    paint(id);
    vPrev.disabled = vi===0; vNext.disabled = vi===results.length-1;
    const aP = document.getElementById('v-arrow-prev'), aN = document.getElementById('v-arrow-next');
    aP.disabled = vPrev.disabled; aN.disabled = vNext.disabled;
    document.getElementById('v-navctx').textContent =
      (navLabel ? navLabel + ' · ' : '') + (vi+1) + ' of ' + results.length;
    viewer.setAttribute('open',''); document.body.style.overflow='hidden';
    side.dataset.open='0'; sheetBtn.setAttribute('aria-expanded','false'); sheetBtn.textContent='Text';
    try { history.replaceState(null, '', '#' + id); } catch(e){ location.hash = id; }
    document.getElementById('v-close').focus();
  }
  function close(){
    navLabel = null;
    // drop the #page from the URL so a reload starts at the main page, not the last-viewed one
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){ location.hash = ''; }
    viewer.removeAttribute('open'); document.body.style.overflow='';
    if (!matchMedia('(hover:none)').matches) qEl.focus();
  }

  /* ============ concept reader ============ */
  const cmodal = document.getElementById('cmodal'), cbody = document.getElementById('c-body');

        `<button class="cpage" data-cpage="${i}"><img src="${thumbSrc(byId[i])}" alt="">

  function goToConcept(cid){

    tab = 'concepts';
    qEl.value = c.name;                   // the concepts-tab filter shows just this card

  }
  function closeConcept(){ cmodal.hidden = true; document.body.style.overflow=''; }
  document.getElementById('c-close').onclick = closeConcept;
  cmodal.addEventListener('click', e => { if (e.target === cmodal) closeConcept(); });
  cbody.addEventListener('click', e => {
    const cp = e.target.closest('[data-cpage]');
    if (cp){
      closeConcept();
      // arrows scroll through THIS concept's pages, in binder order
      navLabel = openCid && CONCEPTS[openCid] ? CONCEPTS[openCid].name : null;
      results = (openCid && CONCEPTS[openCid])
        ? CONCEPTS[openCid].pages.filter(i => byId[i]).map(i => byId[i]).sort((a,b) => a.num - b.num)
        : (scopes[tab]() || PAGES);
      show(cp.dataset.cpage);
    }
  });
  function step(d){ const p = results[vi+d]; if (p) show(p.id); }

  /* ============ events ============ */
  function wire(){
    const tocbox = out.querySelector('#tocbox');
    if (tocbox){
      tocbox.addEventListener('toggle', () => { tocOpen = tocbox.open; });
      out.querySelectorAll('.tocrow').forEach(b => b.onclick = () => {
        qEl.value = b.dataset.range;      // range search: those pages, in order
        render();
        window.scrollTo({top: 0});
      });
    }
    const jb = out.querySelector('[data-jump]');
    if (jb) jb.onclick = () => show(jb.dataset.jump);
    const tryany = out.querySelector('[data-tryany]');
    if (tryany) tryany.onclick = () => setMatch('any');
    const d = out.querySelector('#drop');
    if (d){
      ['dragenter','dragover'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add('over'); }));
      ['dragleave','drop'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove('over'); }));
      d.addEventListener('drop', e => addFiles(e.dataTransfer.files));
      out.querySelector('#b-cam').onclick = () => campick.click();
      out.querySelector('#b-file').onclick = () => filepick.click();
      const ex = out.querySelector('#b-export'); if (ex) ex.onclick = exportScans;
    }
    const c = out.querySelector('#b-copy'); if (c) c.onclick = () => exportMarks(false);
    const v = out.querySelector('#b-csv'); if (v) v.onclick = () => exportMarks(true);
    const u = out.querySelector('#b-unmark');
    if (u) u.onclick = async () => {
      if (!confirm('Unmark all ' + MARKS.size + ' pages?')) return;
      for (const id of [...MARKS]) await DB.del('marks', id);
      MARKS.clear(); render();
    };
  }
  out.addEventListener('click', e => {
    const con = e.target.closest('[data-concept]'); if (con) return openConcept(con.dataset.concept);
    const shot = e.target.closest('[data-id]'); if (shot) return show(shot.dataset.id);
    const mk = e.target.closest('[data-mark]'); if (mk) return toggleMark(mk.dataset.mark);
    const oc = e.target.closest('[data-ocr]'); if (oc) return ocr(oc.dataset.ocr);
    const rm = e.target.closest('[data-rm]');
    if (rm){
      if (!confirm('Remove this scanned page from this device?')) return;
      DB.del('scans', rm.dataset.rm).then(() => { SCANS = SCANS.filter(s => s.id !== rm.dataset.rm); rebuild(); render(); });
    }
  });
  out.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ const con = e.target.closest('[data-concept]'); if (con) openConcept(con.dataset.concept); }
  });
  out.addEventListener('change', async e => {
    const t = e.target.dataset.ttl, k = e.target.dataset.kw;
    const id = t || k; if (!id) return;
    const p = byId[id]; if (!p) return;
    if (t) p.title = e.target.value.slice(0,58) || 'Scanned page';
    if (k) p.kw = e.target.value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean).slice(0,10);
    await DB.put('scans', p); rebuild();
  });
  filepick.onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  campick.onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  const verpick = document.getElementById('verpick'), vercam = document.getElementById('vercam');
  verpick.onchange = e => { if (e.target.files[0] && versionTargetId) addVersion(versionTargetId, e.target.files[0]); e.target.value=''; };
  vercam.onchange  = e => { if (e.target.files[0] && versionTargetId) addVersion(versionTargetId, e.target.files[0]); e.target.value=''; };

  // version history events (delegated on the sidebar)
  document.getElementById('v-versions').addEventListener('click', e => {
    const sel = e.target.closest('[data-ver]');
    if (sel){ const idx = +sel.dataset.ver; const nv = (VERSIONS[shownId]||[]).length; viewingVer = (idx===nv?null:idx); return paint(shownId); }
    const mk = e.target.closest('[data-makecur]');
    if (mk){ return makeVersionCurrent(shownId, +mk.dataset.makecur); }
    const rp = e.target.closest('[data-replace]');
    if (rp){
      versionTargetId = rp.dataset.replace;
      // phone gets a camera option; desktop just the file picker
      if (matchMedia('(hover:none)').matches && confirm('Take a photo of the new version?\n\nOK = camera, Cancel = choose a file'))
        vercam.click();
      else verpick.click();
    }
  });

  document.getElementById('v-share').addEventListener('click', e => {
    const cc = e.target.closest('[data-copycode]');
    const cl = e.target.closest('[data-copylink]');
    if (!cc && !cl) return;
    const text = cc ? cc.dataset.copycode
                    : location.href.split('#')[0] + '#' + cl.dataset.copylink;
    const btn = cc || cl, was = btn.textContent;
    const done = () => { btn.textContent = '✓ Copied'; setTimeout(() => btn.textContent = was, 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => prompt('Copy this:', text));
    else prompt('Copy this:', text);
  });
  document.getElementById('v-concepts').addEventListener('click', e => {
    const c = e.target.closest('[data-concept]'); if (c) goToConcept(c.dataset.concept);
  });
  vCopies.addEventListener('click', e => {
    const c = e.target.closest('[data-copy]'); if (c) return paint(c.dataset.copy);
    const m = e.target.closest('[data-mark]'); if (m) return toggleMark(m.dataset.mark);
  });
  // remove a keyword (× on a chip)
  vKws.addEventListener('click', e => {
    const x = e.target.closest('[data-kwremove]'); if (!x || !shownId) return;
    const p = byId[shownId];
    const list = p.kw.slice(); list.splice(+x.dataset.kwremove, 1);
    saveKw(shownId, list);
  });
  // add a keyword (Enter or comma in the input)
  vKws.addEventListener('keydown', e => {
    if (!(e.key === 'Enter' || e.key === ',')) return;
    e.preventDefault();
    const inp = e.target.closest('#v-kwadd'); if (!inp || !shownId) return;
    const w = inp.value.trim().toLowerCase().replace(/,$/,'');
    if (!w) return;
    const p = byId[shownId];
    if (!p.kw.includes(w)) saveKw(shownId, p.kw.concat(w));
    else inp.value = '';
  });
  document.getElementById('v-close').onclick = close;
  vPrev.onclick = () => step(-1); vNext.onclick = () => step(1);
  document.getElementById('v-arrow-prev').onclick = () => step(-1);
  document.getElementById('v-arrow-next').onclick = () => step(1);
  sheetBtn.onclick = () => {
    const o = side.dataset.open === '1';
    side.dataset.open = o ? '0' : '1';
    sheetBtn.setAttribute('aria-expanded', String(!o)); sheetBtn.textContent = o ? 'Text' : 'Hide';
  };
  document.addEventListener('keydown', e => {
    if (!cmodal.hidden && e.key === 'Escape') return closeConcept();
    if (!viewer.hasAttribute('open')){
      if (e.key === '/' && document.activeElement !== qEl && !/INPUT/.test(document.activeElement.tagName)){ e.preventDefault(); qEl.focus(); }
      return;
    }
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  viewer.addEventListener('click', e => { if (e.target.classList.contains('stage')) close(); });

  // page turning is via the arrows (and keyboard) only — no tap-zoom, no swipe-to-turn.
  // Pinch-zoom stays native via touch-action on .stage.

  document.getElementById('tabs').onclick = e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    tab = b.dataset.tab; render();
  };
  document.getElementById('chips').onclick = e => {
    if (e.target.classList.contains('chip')){ qEl.value = e.target.textContent; render(); }
  };
  let timer;
  qEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 110); });
  qEl.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const id = codeToId(qEl.value);
    if (id){ e.preventDefault(); show(id); }         // "HI-047" + Enter goes straight there
  });
  clearEl.onclick = () => { qEl.value=''; render(); qEl.focus(); };
  // phone: pin only the search field + tabs. The header sits at a negative sticky
  // top equal to the height of everything above the search field, so the title,
  // tagline and controls scroll off naturally with the page — pure native scrolling.
  const phoneHdr = matchMedia('(max-width:700px)');
  function sizePin(){
    const sb = document.querySelector('.searchbar');
    if (!phoneHdr.matches){ sb.style.top = ''; return; }
    const above = document.querySelector('.searchbar .field').getBoundingClientRect().top
                - sb.getBoundingClientRect().top;
    sb.style.top = (-Math.max(0, Math.round(above))) + 'px';
  }
  window.addEventListener('resize', sizePin, {passive: true});
  window.addEventListener('orientationchange', sizePin);
  setTimeout(sizePin, 0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizePin);
  const setSort = s => {
    sort = s;
    document.getElementById('s-rel').setAttribute('aria-pressed', String(s==='rel'));
    document.getElementById('s-page').setAttribute('aria-pressed', String(s==='page'));
    render();
  };
  document.getElementById('s-rel').onclick = () => setSort('rel');
  document.getElementById('s-page').onclick = () => setSort('page');
  function setMatch(m){
    matchMode = m;
    document.getElementById('m-all').setAttribute('aria-pressed', String(m === 'all'));
    document.getElementById('m-any').setAttribute('aria-pressed', String(m === 'any'));
    render();
  }
  document.getElementById('m-all').onclick = () => setMatch('all');
  document.getElementById('m-any').onclick = () => setMatch('any');
  document.getElementById('s-dups').onclick = e => {
    hideDups = !hideDups;
    e.target.setAttribute('aria-pressed', String(!hideDups));
    e.target.textContent = hideDups ? 'Show duplicates' : 'Hiding extras';
    render();
  };

  /* ============ boot ============ */
  (async () => {
    rebuild();
    await DB.init();
    SCANS = (await DB.all('scans')) || [];
    (await DB.all('marks') || []).forEach(m => MARKS.add(m.id));
    (await DB.all('kwedits') || []).forEach(k => { KWEDIT[k.id] = k.kw; });
    (await DB.all('versions') || []).forEach(v => { VERSIONS[v.id] = v.list; });
    rebuild(); paintChips();
    if (matchMedia('(max-width:760px)').matches) qEl.placeholder = 'Search, or a page number';
    render();

    // a link like ...index.htm#HI-047 opens straight onto that page
    const openFromHash = () => {
      const h = decodeURIComponent(location.hash.replace('#','')).trim();
      if (!h) return;
      const id = byId[h] ? h : codeToId(h);
      if (id) show(id);
    };
    openFromHash();
    window.addEventListener('hashchange', openFromHash);

    if (!matchMedia('(hover:none)').matches && !location.hash) qEl.focus();
  })();
})();
</script>
</body>
</html>
